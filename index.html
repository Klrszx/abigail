<script>

    /* =========================================================
       PREGUNTAS
    ========================================================== */

    const preguntas = {
        1: "pregunta1",
        2: "pregunta2",
        3: "pregunta3",
        4: "pregunta4",
        5: "pregunta5"
    };


    /* =========================================================
       RESPUESTAS CORRECTAS
    ========================================================== */

    const respuestasCorrectas = {
        1: "respuesta1",
        2: "respuesta2",
        3: "respuesta3",
        4: "respuesta4",
        5: "respuesta5"
    };


    /* =========================================================
       MOSTRAR LAS PREGUNTAS
    ========================================================== */

    document.querySelector("#pantalla2 .pregunta").textContent = preguntas[1];

    document.querySelector("#pantalla3 .pregunta").textContent = preguntas[2];

    document.querySelector("#pantalla4 .pregunta").textContent = preguntas[3];

    document.querySelector("#pantalla5 .pregunta").textContent = preguntas[4];

    document.querySelector("#pantalla6 .pregunta").textContent = preguntas[5];


    /* =========================================================
       CAMBIAR DE VENTANA
    ========================================================== */

    function irA(numero) {

        document.querySelectorAll(".pantalla").forEach(pantalla => {
            pantalla.classList.remove("activa");
        });

        const siguiente =
            document.getElementById("pantalla" + numero);

        siguiente.classList.add("activa");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    /* =========================================================
       NORMALIZAR RESPUESTAS
       
       Permite que:
       respuesta1
       RESPUESTA1
       Respuesta1
       
       sean consideradas iguales.
    ========================================================== */

    function normalizar(texto) {

        return texto
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim();

    }


    /* =========================================================
       COMPROBAR RESPUESTA
    ========================================================== */

    function comprobar(numero) {

        const input =
            document.getElementById("respuesta" + numero);

        const feedback =
            document.getElementById("feedback" + numero);

        const boton =
            document.getElementById("boton" + numero);


        const respuestaUsuario =
            normalizar(input.value);

        const respuestaCorrecta =
            normalizar(respuestasCorrectas[numero]);


        /* =====================================================
           RESPUESTA CORRECTA
        ===================================================== */

        if (respuestaUsuario === respuestaCorrecta) {

            feedback.textContent =
                "♡ ¡Correcto! Puedes continuar.";

            feedback.className =
                "feedback correcta";


            /*
               Bloqueamos el campo porque ya respondió
               correctamente.
            */

            input.disabled = true;


            /*
               Cambiamos el botón para permitir avanzar.
            */

            boton.textContent =
                numero === 5
                    ? "VER MI SORPRESA 🌼"
                    : "SIGUIENTE";


            /*
               Cambiamos la función del botón.
            */

            boton.onclick = function() {

                if (numero === 5) {

                    irA(7);

                } else {

                    /*
                       Las pantallas de preguntas son:

                       pregunta 1 → pantalla 2
                       pregunta 2 → pantalla 3
                       pregunta 3 → pantalla 4
                       pregunta 4 → pantalla 5
                       pregunta 5 → pantalla 6

                       Por eso sumamos 1.
                    */

                    irA(numero + 2);

                }

            };

        }


        /* =====================================================
           RESPUESTA INCORRECTA
        ===================================================== */

        else {

            feedback.textContent =
                "♡ Esa no es la respuesta... inténtalo otra vez.";

            feedback.className =
                "feedback incorrecta";


            /*
               MUY IMPORTANTE:

               NO avanzamos.
               El botón sigue siendo "COMPROBAR".
            */

            boton.textContent = "COMPROBAR";


            /*
               El campo sigue habilitado para que
               pueda volver a intentarlo.
            */

            input.disabled = false;

            input.focus();

        }

    }


    /* =========================================================
       ENTER PARA COMPROBAR
    ========================================================== */

    document.querySelectorAll(".respuesta").forEach(input => {

        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                const numero =
                    Number(
                        this.id.replace("respuesta", "")
                    );

                comprobar(numero);

            }

        });

    });

</script>
